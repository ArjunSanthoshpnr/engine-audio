<!DOCTYPE html>
<html lang="en" style="background: black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENGINE SOUNDS</title>

    <style>
      body {
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
        background: #000;
        overflow-x: hidden;
      }

      h1 {
        margin-top: 20px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }

      #start_btn {
        font-size: 2em;
        padding: 10px 40px;
        background: #222;
        color: #fff;
        border: 2px solid #555;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      #start_btn:hover {
        background: #444;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      }

      /* Dashboard UI */
      #dashboard {
        display: none;
        justify-content: center;
        align-items: center;
        gap: 50px;
        margin-top: 50px;
      }

      .meter {
        position: relative;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.8) inset, 0 0 20px rgba(255, 255, 255, 0.05);
      }

      #tachometer {
        background-image: url('/tachometer_dial.png');
      }

      #speedometer {
        background-image: url('/speedometer_dial.png');
      }

      .needle {
        position: absolute;
        width: 6px;
        height: 40%;
        background: linear-gradient(to top, #ff2a2a, #ff7a7a);
        bottom: 50%;
        left: calc(50% - 3px);
        transform-origin: bottom center;
        border-radius: 3px 3px 0 0;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.9);
        transition: transform 0.05s ease-out;
        transform: rotate(-135deg); /* Default zero position */
        z-index: 10;
      }

      .needle::after {
        content: '';
        position: absolute;
        width: 30px;
        height: 30px;
        background: radial-gradient(circle, #333, #111);
        border: 2px solid #555;
        border-radius: 50%;
        bottom: -15px;
        left: -12px;
        box-shadow: 0 5px 10px rgba(0,0,0,0.5);
      }

      /* Digital Readouts */
      .readout {
        position: absolute;
        bottom: 25%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.5em;
        font-weight: bold;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        padding: 5px 15px;
        border-radius: 5px;
        border: 1px solid #333;
        text-shadow: 0 0 5px rgba(255,255,255,0.5);
      }

      .gear-indicator {
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 3em;
        font-weight: bold;
        color: #ff3333;
        text-shadow: 0 0 15px rgba(255, 50, 50, 0.8);
        background: rgba(0, 0, 0, 0.8);
        padding: 10px 20px;
        border-radius: 10px;
        border: 2px solid #440000;
        z-index: 5;
      }

      #controls {
        display: none;
        margin-top: 30px;
        color: #aaa;
      }
      #controls h2 { color: #ddd; }
    </style>

  </head>
  <body>

    <h1>Engine Sound Simulator</h1>

    <button id="start_btn">Start Engine</button>

    <div id="dashboard">
      <div id="tachometer" class="meter">
        <div id="rpm_needle" class="needle"></div>
        <div class="gear-indicator" id="gear_display">N</div>
        <div class="readout" id="rpm_readout">0 RPM</div>
      </div>
      
      <div id="speedometer" class="meter">
        <div id="speed_needle" class="needle"></div>
        <div class="readout" id="speed_readout">0 km/h</div>
      </div>
    </div>

    <div id="controls">
      <h2>Controls:</h2>
      <p>Space: LETS GOOO &nbsp; | &nbsp; Arrow up/down: change gear &nbsp; | &nbsp; B: apply brakes</p>
      <p id="gamepad_debug" style="color: #ffaa00; font-family: monospace; font-size: 1.2em; margin-top: 15px;"></p>
    </div>

</html>
