    <meta charset="UTF-8" />

    <title>ENGINE SOUNDS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
      body {
        color: white;
        font-family: 'Rajdhani', 'Segoe UI', sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
        background: #050508;
        background-image: radial-gradient(circle at 50% 50%, #111122 0%, #050508 100%);
        min-height: 100vh;
        overflow-x: hidden;
      }

      h1 {
        margin-top: 0;
        padding-top: 20px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }

      #start_btn {
        font-size: 2em;
        padding: 10px 40px;
        background: #222;
        color: #fff;
        border: 2px solid #555;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      #start_btn:hover {
        background: #444;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      }

      /* Dashboard UI */
      #dashboard {
        display: none;
        justify-content: center;
        align-items: center;
        gap: 80px;
        margin-top: 50px;
      }

      .meter {
        position: relative;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        box-shadow: 0 0 60px rgba(0, 210, 255, 0.1), 0 0 30px rgba(0, 0, 0, 0.8) inset;
        border: 2px solid rgba(0, 210, 255, 0.1);
      }

      

      

      .dial-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

      .needle { z-index: 10; 
        position: absolute;
        width: 4px;
        height: 45%;
        background: #00d2ff;
        bottom: 50%;
        left: calc(50% - 2px);
        transform-origin: bottom center;
        border-radius: 2px;
        box-shadow: 0 0 20px #00d2ff, 0 0 10px #00e5ff inset;
        transition: transform 0.05s ease-out;
        transform: rotate(-135deg); /* Default zero position */
        z-index: 10;
        clip-path: polygon(50% 0%, 100% 10%, 100% 100%, 0% 100%, 0% 10%);
      }

      .needle::after {
        content: '';
        position: absolute;
        width: 40px;
        height: 40px;
        background: #08080c;
        border: 2px solid #00d2ff;
        border-radius: 50%;
        bottom: -20px;
        left: -18px;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
      }

      /* Digital Readouts */
      .readout { z-index: 10; 
        position: absolute;
        bottom: 22%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.6em;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        letter-spacing: 2px;
        color: #00d2ff;
        background: rgba(10, 10, 20, 0.7);
        backdrop-filter: blur(5px);
        padding: 5px 15px;
        border-radius: 8px;
        border: 1px solid rgba(0, 210, 255, 0.3);
        box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
      }

      .gear-indicator { 
        font-size: 5.5em;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        color: #ff0055;
        text-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
        background: rgba(10, 10, 20, 0.7);
        backdrop-filter: blur(5px);
        padding: 15px 40px;
        border-radius: 12px;
        border: 2px solid rgba(255, 0, 85, 0.3);
        box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        min-width: 80px;
      }

      #controls {
        display: none;
        margin-top: 30px;
        color: #aaa;
      }
      #controls h2 { color: #ddd; }
    </style>

  </head>
